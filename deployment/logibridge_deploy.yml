---
# Task E2: LogiEdge OTA deployment playbook -- exactly 7 tasks, run
# against each truck's edge node (Raspberry Pi 5 + AI HAT+, see
# hardware/hardware_justification.md).
- name: Deploy LogiEdge inference container to truck edge node
  hosts: truck_edge_nodes
  become: false
  vars:
    logibridge_dir: /opt/logibridge
    model_src: "{{ playbook_dir }}/../training/models/model_pruned_int8.tflite"
    reference_dist_src: "{{ playbook_dir }}/../monitoring/reference_dist.json"
    # Local registry port is 5050 in this dev environment (macOS reserves
    # 5000 for AirPlay Receiver); a real fleet registry would run on the
    # standard 5000.
    image_name: "localhost:5050/logibridge-inference:latest"
    container_name: logibridge-inference

  tasks:
    - name: 1. Create /opt/logibridge directory if not present
      ansible.builtin.file:
        path: "{{ logibridge_dir }}"
        state: directory
        mode: "0755"

    - name: 2. Copy new model file to /opt/logibridge/model.tflite
      ansible.builtin.copy:
        src: "{{ model_src }}"
        dest: "{{ logibridge_dir }}/model.tflite"
        mode: "0644"
      register: model_copy

    - name: 3. Copy updated reference_dist.json
      ansible.builtin.copy:
        src: "{{ reference_dist_src }}"
        dest: "{{ logibridge_dir }}/reference_dist.json"
        mode: "0644"
      register: ref_copy

    # Only stop the container when a genuinely new model/reference file
    # is being deployed -- an unconditional stop+start every run would
    # report changed=1 forever and defeat the idempotency check below.
    # (A new image is handled by task 6's own idempotent recreate check.)
    - name: 4. Stop the running inference container if running
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: stopped
      when: model_copy.changed or ref_copy.changed

    - name: 5. Pull updated container image from local Docker registry
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: pull
        force_source: true
      register: image_pull

    - name: 6. Start inference container with environment variables
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: unless-stopped
        env:
          MODEL_PATH: "/app/model.tflite"
          STATS_PATH: "/app/training_stats.npy"
          MQTT_BROKER: "host.docker.internal"
          MQTT_PORT: "1883"
          TRUCK_ID: "{{ inventory_hostname }}"
        volumes:
          - "{{ logibridge_dir }}/model.tflite:/app/model.tflite:ro"
          - "{{ logibridge_dir }}/reference_dist.json:/app/reference_dist.json:ro"

    # An `until`/`retries` loop exits as soon as the condition is true,
    # which for an already-running container means "verify immediately"
    # rather than "wait 15 seconds" -- not what the task literally asks
    # for. This waits an unconditional 15s (giving the container time to
    # finish its own startup/model-load sequence) and only then checks
    # docker's own state, in a single task.
    - name: 7. Wait 15 seconds and verify container is running
      ansible.builtin.shell: |
        sleep 15
        docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' {{ container_name }}
      register: wait_verify
      changed_when: false
      failed_when: wait_verify.stdout | trim != "true"
