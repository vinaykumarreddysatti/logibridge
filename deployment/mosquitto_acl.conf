# Per-user topic ACLs for the production Mosquitto broker
# (mosquitto_production.conf). Referenced values match the topic tree
# in data_pipeline/mqtt_architecture.md. Three least-privilege roles,
# one per logical client -- NOT one shared "truck" credential, since the
# sensor publisher and the inference consumer need opposite read/write
# access on the sensors/# topics.

# data_pipeline/simulator.py: publishes sensor readings, reads the
# control topic to switch anomaly mode live.
user logibridge_sensors
topic write logibridge/trucks/+/sensors/#
topic read logibridge/trucks/+/control/anomaly

# inference/inference_service.py: subscribes to sensor readings,
# publishes classification results. Never needs to write raw sensor
# data or read the control topic.
user logibridge_inference
topic read logibridge/trucks/+/sensors/#
topic write logibridge/trucks/+/inference

# monitoring/drift_monitor.py + ops-centre backend: reads everything
# for fleet monitoring, and can write the control topic (used here to
# drive the live drift-injection demo against a running simulator).
user logibridge_ops
topic read logibridge/trucks/#
topic write logibridge/trucks/+/control/anomaly
