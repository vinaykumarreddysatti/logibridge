# LogiEdge production Mosquitto config -- truck edge node.
#
# Contrast with mosquitto_local.conf (dev/test only, allow_anonymous
# true): this profile requires TLS + per-client username/password auth,
# matching the privacy claim in scenario_architecture/constraint_analysis.md
# ("only over an authenticated MQTT channel"). Generate credentials with
# ./generate_mqtt_credentials.sh before starting mosquitto with this file.

# Plaintext listener disabled in production -- TLS only.
listener 8883
cafile /opt/logibridge/certs/ca.crt
certfile /opt/logibridge/certs/broker.crt
keyfile /opt/logibridge/certs/broker.key
tls_version tlsv1.2

allow_anonymous false
password_file /opt/logibridge/mosquitto_passwd.txt

# Per-client ACLs: the truck's own sensor/simulator processes only need
# to publish sensor/inference/alert topics and subscribe to their own
# control topic; the ops-centre credential is for fleet-wide monitoring.
acl_file /opt/logibridge/mosquitto_acl.conf
