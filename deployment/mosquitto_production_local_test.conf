# Production-security Mosquitto profile for LOCAL TESTING of this repo
# (TLS + auth + ACLs, same security posture as mosquitto_production.conf,
# but with paths that actually resolve on a dev machine).
#
# mosquitto_production.conf uses /opt/logibridge/... paths because that is
# where deployment/logibridge_deploy.yml puts files on a real truck edge
# node -- those paths do not exist on a laptop unless you copy files
# there yourself. This file points at the same cert/password/ACL files
# generate_mqtt_credentials.sh writes into deployment/, resolved relative
# to mosquitto's working directory.
#
# Run from inside deployment/ (mosquitto resolves relative paths against
# its own CWD, not the config file's location):
#   cd deployment && mosquitto -c mosquitto_production_local_test.conf

listener 8883
cafile ./certs/ca.crt
certfile ./certs/broker.crt
keyfile ./certs/broker.key
tls_version tlsv1.2

allow_anonymous false
password_file ./mosquitto_passwd.txt
acl_file ./mosquitto_acl.conf
